<div class="dashboard-wrapper">
  <div class="dashboard-header">
    <h1>Dashboard</h1>

    @if (!isLoading && yearOptions.length > 0) {
      <div class="filters">
        <app-desplegable
          [options]="yearOptions"
          [value]="selectedYear"
          [maxHeight]="true"
          [disabled]="isLoading"
          (valueChange)="onYearChange($event)"
        />
      </div>
    }
  </div>

  <div class="dashboard-split">
    <div class="left">
      <app-doughnut-chart [games]="gamesData" [loading]="isLoading"> </app-doughnut-chart>
    </div>

    <div class="right">
      <app-completed-stats
        [completed]="completedGames"
        [online]="onlineGames"
        [abandoned]="abandonedGames"
        [loading]="isLoading"
      >
      </app-completed-stats>

      <app-platinum-stats [totalPlatinum]="platinumGames" [loading]="isLoading">
      </app-platinum-stats>
    </div>
  </div>
</div>
